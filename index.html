<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./assets/lock.ico" type="image/x-icon">
    <title>Tradutor Criptográfico</title>
</head>

<body>

    <header>

        <h1>Tradutor Criptográfico</h1>

        <span class="material-symbols-outlined swap-btn" onclick="inverterCampos()">
            forward_media
        </span>

    </header>


    <div class="container">
        <textarea id="input" placeholder="Mensagem Criptografada"></textarea>


        <textarea id="output" placeholder="Mensagem" readonly></textarea>
    </div>

    <div class="buttons">
        <button id="translate_btn" onclick="traduzir()">Descriptografar</button>
        <button onclick="copiarTexto()">Copiar</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
